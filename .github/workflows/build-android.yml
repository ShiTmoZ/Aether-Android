name: Build Aether MASQUE Android

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Fetch Verified Native Engines (Aether & hev-socks5-tunnel)
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          echo "[*] Downloading native engine package..."
          curl -sL https://github.com/patterniha/PattNG/releases/download/2.3.13-P69/PattNG_2.3.13-P69_arm64-v8a.apk -o /tmp/pattng.apk
          unzip -p /tmp/pattng.apk lib/arm64-v8a/libaether.so > app/src/main/jniLibs/arm64-v8a/libaether.so
          unzip -p /tmp/pattng.apk lib/arm64-v8a/libhev-socks5-tunnel.so > app/src/main/jniLibs/arm64-v8a/libhev-socks5-tunnel.so
          chmod +x app/src/main/jniLibs/arm64-v8a/libaether.so
          ls -lh app/src/main/jniLibs/arm64-v8a/

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Assemble Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare Release Artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/AetherClient-v1.0.0-Android-arm64.apk
          ls -lh dist/

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AetherClient-Android-arm64
          path: dist/AetherClient-v1.0.0-Android-arm64.apk

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v1.0.0"
          gh release delete $TAG_NAME --yes || true
          git tag -d $TAG_NAME 2>/dev/null || true
          git push origin :refs/tags/$TAG_NAME 2>/dev/null || true
          
          gh release create $TAG_NAME dist/AetherClient-v1.0.0-Android-arm64.apk \
            --title "Aether MASQUE Android v1.0.0 (SetProduct Liquid Glass)" \
            --notes "### Aether MASQUE Android Client v1.0.0
            
            - **Design**: Native Jetpack Compose SetProduct Liquid Glass Obsidian UI.
            - **Engine**: Cloudflare MASQUE HTTP/2 (RFC 9298) on port 443 with Turbo mode.
            - **Architecture**: 64-bit ARM (`arm64-v8a`) with lossless MTU 1360.
            - **Routing**: Android VpnService L3 tunnel powered by JNI hev-socks5-tunnel."
