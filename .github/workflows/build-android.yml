name: Build Aether MASQUE Android

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Fetch Multi-Arch Native Engines (arm64, armv7, x86_64)
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          mkdir -p app/src/main/jniLibs/armeabi-v7a
          mkdir -p app/src/main/jniLibs/x86_64
          
          echo "[*] Downloading arm64 engine..."
          curl -sL https://github.com/patterniha/PattNG/releases/download/2.3.13-P69/PattNG_2.3.13-P69_arm64-v8a.apk -o /tmp/pattng_arm64.apk
          unzip -p /tmp/pattng_arm64.apk lib/arm64-v8a/libaether.so > app/src/main/jniLibs/arm64-v8a/libaether.so
          unzip -p /tmp/pattng_arm64.apk lib/arm64-v8a/libhev-socks5-tunnel.so > app/src/main/jniLibs/arm64-v8a/libhev-socks5-tunnel.so
          
          echo "[*] Downloading armeabi-v7a engine..."
          curl -sL https://github.com/patterniha/PattNG/releases/download/2.3.13-P69/PattNG_2.3.13-P69_armeabi-v7a.apk -o /tmp/pattng_armv7.apk
          unzip -p /tmp/pattng_armv7.apk lib/armeabi-v7a/libaether.so > app/src/main/jniLibs/armeabi-v7a/libaether.so
          unzip -p /tmp/pattng_armv7.apk lib/armeabi-v7a/libhev-socks5-tunnel.so > app/src/main/jniLibs/armeabi-v7a/libhev-socks5-tunnel.so
          
          echo "[*] Downloading x86_64 engine..."
          curl -sL https://github.com/patterniha/PattNG/releases/download/2.3.13-P69/PattNG_2.3.13-P69_x86_64.apk -o /tmp/pattng_x86_64.apk
          unzip -p /tmp/pattng_x86_64.apk lib/x86_64/libaether.so > app/src/main/jniLibs/x86_64/libaether.so
          unzip -p /tmp/pattng_x86_64.apk lib/x86_64/libhev-socks5-tunnel.so > app/src/main/jniLibs/x86_64/libhev-socks5-tunnel.so
          
          ls -lh app/src/main/jniLibs/*

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Assemble Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify APK Signatures (V1 & V2)
        run: |
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Prepare Release Artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/AetherClient-v1.0.2-Universal.apk
          ls -lh dist/

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AetherClient-v1.0.2-Universal
          path: dist/AetherClient-v1.0.2-Universal.apk

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v1.0.2"
          gh release delete $TAG_NAME --yes || true
          git tag -d $TAG_NAME 2>/dev/null || true
          git push origin :refs/tags/$TAG_NAME 2>/dev/null || true
          
          gh release create $TAG_NAME dist/AetherClient-v1.0.2-Universal.apk \
            --title "Aether MASQUE Android v1.0.2 (Production Fix for MASQUE Config & Handshake)" \
            --notes "### Aether MASQUE Android v1.0.2
            
            - **Valid Provisioned Identity**: Injected active Cloudflare MASQUE identity keys and profile.
            - **Strict MASQUE HTTP/2 Arguments**: Passed explicit \`--protocol masque\`, \`--h2\`, \`--scan turbo\`, \`--quick-reconnect\`, and \`--masque-config\`.
            - **Permanent Release Keystore**: All future updates will install seamlessly without signature conflicts.
            - **Universal ABI Support**: Native engines for \`armeabi-v7a\` (Galaxy A10s / budget 32-bit devices), \`arm64-v8a\` (modern phones), and \`x86_64\` (PC emulators).
            - **Full Dual V1/V2 Signatures**: Clean install and upgrade without package conflicts."
