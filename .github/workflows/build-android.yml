name: Build Aether MASQUE Android

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Fetch Multi-Arch Native Engines (arm64, armv7, x86_64)
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          mkdir -p app/src/main/jniLibs/armeabi-v7a
          mkdir -p app/src/main/jniLibs/x86_64
          
          echo "[*] Downloading arm64 engine..."
          curl -sL https://github.com/patterniha/PattNG/releases/download/2.3.13-P69/PattNG_2.3.13-P69_arm64-v8a.apk -o /tmp/pattng_arm64.apk
          unzip -p /tmp/pattng_arm64.apk lib/arm64-v8a/libaether.so > app/src/main/jniLibs/arm64-v8a/libaether.so
          unzip -p /tmp/pattng_arm64.apk lib/arm64-v8a/libhev-socks5-tunnel.so > app/src/main/jniLibs/arm64-v8a/libhev-socks5-tunnel.so
          
          echo "[*] Downloading armeabi-v7a engine..."
          curl -sL https://github.com/patterniha/PattNG/releases/download/2.3.13-P69/PattNG_2.3.13-P69_armeabi-v7a.apk -o /tmp/pattng_armv7.apk
          unzip -p /tmp/pattng_armv7.apk lib/armeabi-v7a/libaether.so > app/src/main/jniLibs/armeabi-v7a/libaether.so
          unzip -p /tmp/pattng_armv7.apk lib/armeabi-v7a/libhev-socks5-tunnel.so > app/src/main/jniLibs/armeabi-v7a/libhev-socks5-tunnel.so
          
          echo "[*] Downloading x86_64 engine..."
          curl -sL https://github.com/patterniha/PattNG/releases/download/2.3.13-P69/PattNG_2.3.13-P69_x86_64.apk -o /tmp/pattng_x86_64.apk
          unzip -p /tmp/pattng_x86_64.apk lib/x86_64/libaether.so > app/src/main/jniLibs/x86_64/libaether.so
          unzip -p /tmp/pattng_x86_64.apk lib/x86_64/libhev-socks5-tunnel.so > app/src/main/jniLibs/x86_64/libhev-socks5-tunnel.so
          
          ls -lh app/src/main/jniLibs/*

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Assemble Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify APK Signatures (V1 & V2)
        run: |
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Prepare Release Artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/AetherClient-v1.0.4-Universal.apk
          ls -lh dist/

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AetherClient-v1.0.4-Universal
          path: dist/AetherClient-v1.0.4-Universal.apk

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v1.0.4"
          gh release delete $TAG_NAME --yes || true
          git tag -d $TAG_NAME 2>/dev/null || true
          git push origin :refs/tags/$TAG_NAME 2>/dev/null || true
          
          gh release create $TAG_NAME dist/AetherClient-v1.0.4-Universal.apk \
            --title "Aether MASQUE Android v1.0.4 (MASQUE-in-MASQUE Dual-Hop, Adaptive Engine & Universal Optimization)" \
            --notes "### Aether MASQUE Android v1.0.4
            
            - **MASQUE-in-MASQUE (MIM) Dual-Hop Tunneling**: Optional one-tap toggle for dual-layer nested HTTP/2 encapsulation (\`--mim\`). Egress traffic is routed from Cloudflare ingress edge to European exit points (Germany/Netherlands), ensuring European GeoIP on all geo-restricted services.
            - **Hardware-Aware Adaptive Engine Profile**: Replaced monolithic high-server threading with dynamic hardware profiling (\`low\` for 32-bit/entry-level SoC like Galaxy A10s Helio P22, \`medium\` for mid-range/flagship mobile CPUs) to eliminate memory thrashing, CPU lockups, and kernel context-switching lag.
            - **Zero-Latency Handshake Initiation**: Added \`--no-data-check\` and smart reconnect caching to bypass initial verification stalls, cutting 2-5 seconds off connection startup.
            - **Dynamic Memory-Aware TProxy Buffers**: Smart scaling of \`hev-socks5-tunnel\` coroutine stack and socket buffers based on runtime heap memory.
            - **Leak-Proof Routing**: Hardened IPv4 routing matrix with \`-4\` and cellular IPv6 leak blocking.
            - **Cyberpunk UI Polish**: Added neon purple dual-hop active indicators, dynamic state morphing, and haptic feedback."
